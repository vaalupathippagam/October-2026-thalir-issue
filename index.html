ு இளமையில் வறுமை” என்றா ர் ஔவை. அந்த வறுமைதனைப் போக்க இத்திடடம் உதவட்டும். மாணவர்கள் பயனுறட்டும். அடுதததாகக, கல ைத் திருவிழா. நம் மாவட்டத்தில் என்ன போட்டிககள் நடந்தாலும், என்ன திருவிழாக்கள் நடந்தாலும் நம் பள்ளி மாணவர்களின் பங்களிப்பு இல்லாம ல் இருக்கா து. காரணம் ஒவ்வொரு துறையில் மின்னும் வைரங்களாய் நீங்கள் இருப்பதுதான். பரதநாட்டியத்தில் தனி நபர், குழுவாகக மாநிலம் வரை சென்று வந்திருக்கிறீர்கள். பறை, தவில், நாட்டுப்புற நடனம் ஆகிய பிரிவுககளிலும் மாநில அளவில் சென்று உங்களின் திறமைகளை காண்பித்து, நம் பள்ளிக்கு பெருமை சேர்த்திருக்கிறீர்கள். அந்த மாணவர்களுக்கு எனது மனமார்ந்தர்ந்த வாழ்த்துக்கள். அடுதத இதழில் இவர்களைப் பற்றிப் பார்க்கலாம். அரசின் திடடங்கள�ோ, கல ைத் திருவிழாக்கள�ோ… இவை எல்லா ம் உங்களுக்கு பள்ளியின் மூலம் கூடுதலாககக் கிடைக்கும் வாய்ப்புககள். வாய்ப்பு அவ் வளவு எளிதில் நமக்கு கிடைத்துவிடாது. கிடைக்கும் வாய்ப்பை எக்கா ரணம் க�ொண்டும் நழுவ விடக்கூடாது. இது நம்மா ல் முடியுமா? என்று தயங்குவதைவிட, அதற்கான முழு முயற்சிகளைக் க�ொடுத்து, பயிற்சிகளை எடுத்து ம�ோதிப்பாருங்கள். ககல்விய�ோடு சேர்ந்து பல வெற்றிக்கனிகளை உங்களால் ருசிக்க முடியும். உங்களால் முடியும் என நம்புங்கள். உங்களை உற்சாககப்படுதத, உத்வேககப்படுதத, உதவிட நாங்கள் இருக்கிற�ோம். நவம்பர் 8 அன்று தீபாவளி வருகிறது. புத்தாடை அணிந்து, பாதுகாப்பான முறையில் க�ொண்டாடி, வாழ்வில் தீப ஒளியாய் மின்ன வாழ்த்துகிறேன். மகிழ்வுடன் க.சுந்தர பிரதீபா தளிர் அக்டோபர் 2026 2 | |"}, {"page": 3, "pdf_page": 3, "text": "மா ணவர்க ளின் உடல் நலத் தையும் ககல்வி வளர்ச்சியையும் ககருத்தில் க�ொண்டு செயல்படுததப்படும் “பெருந்தலைவர் காமராஜர் காலை உணவுத் திட்டம்” நமது பள்ளியில் 22.09.2026 அன்று த�ொடங்கப் படடது. இத்திட்டத்தின் மூலம் நமது பள்ளியில் 6, 7 மற்றும் 8ஆம் வகுப்பு பயிலும் அனைத்து மாணவர்களுக்கும் அன்று முதல் தினமும் கால ை உணவு வழங்கப்பட்டு வருகிறது. சத்தான மற்றும் சுவையான கால ை உணவை மாணவர்கள் மகிழ்ச்சியுடன் உண்டு, புத்துணர்ச்சியுடன் பள்ளி செயல்பா டுககளில் ஈடுபட்டு வருகின்றன ர். மாணவர்களின் ஆர�ோக்கியம், ஊட் டச்சத்து மற்றும் ககற்றல் திறனை னை மேம்படுத்தும் வகையில் இத்திடடம் பயனுள்ளதாகக அமைந்துள்ளது. மாணவர்களின் நலனை னை முன்னிறுத்தி செயல்படுததப்படும் இத்திடடம், பள்ளி மாணவர்கள் மற்றும் பெற்றோர்களிடையே மகிழ்ச்சியையும் நம்பிக்கையை யும் ஏற்படுத்தியுள்ளது. “சத்தான உணவு சிறப்பான கல்வி வளமான எதிர்காலம்!” பெருந்தலைவர் காமராஜர் காலை உணவுத் திட்ட த�ொடடகக விழா அரசு மேல்நிலைபபள்ளி, பாலவநததம் தளிர் அக்டோபர் 2026 3 | |"}, {"page": 4, "pdf_page": 4, "text": "அனை னைவருக்கும் வணக்கம் என்னுடைய பெயர் கவி. நான் சமீபத்தில் எஸ். ராமகிருஷணன் அவர்கள் எழுதிய ‘கால் முளைதத கதைககள்’ என்ற புத்தககத் தைப் படித்தேன். இந்தப் புத்தககம் உலகின் பல்வேறு பகுதிககளில் வாழ்ந்தழ்ந்த பழங்குடி மக்களின் நாட�ோடிக் கதைககளின் த�ொகுப்பாகும். இந்த நூலில் ஆப்பிரிக்கா , தென் அமெரிக்கா போன்ற பல பகுதிகளை ச் சேர்ந்தர்ந்த மக்களின் வாய் மொழிக் கதை ககள் இடம்பெற் றுள்ளன . அவர்கள் தங்கள் வாழ்க்கையிலும் இயற் கையிலும் பார்த்தத நிககழ்வுகளை அடிப்படையாககக் க�ொண்டு இந்தக் கதைகளை உருவாக்கியுள்ளன ர். இந்தப் புத் தகத்தில் மனிதர்க ள் எப்ப டி த�ோன்றினார்க ள், கா ககம் ஏன் ககறுப் பாகக மாறியது, பூக்களுக்கு எப்படி வெவ்வேறு வண்ணங்கள் கிடைத்தன போன்ற பல சுவாரசியமான கதைககள் உள்ளன . இக்கதைககள் அனைத்தும் நம்முடைய ககற்பனையைத் தூண்டும் வகையில் உள்ளன . இ ந் த ப் புத் தகத்தில் கதை ககள் நம்மைச் சுற்றியுள்ள வாழ்க்கை நிககழ்வுகள�ோடு த�ொடர்புடையதாகக த�ோன்றுகின்றன மனிதர்களின் எண்ணங்க ள் உணர்வுககள் மற்றும் அனுபவங்களை ஆசிரியர் சுவாரசியமாகக எடுத்துச் ச�ொல்கிறார். பெரிய ககருத்துக்களை நேரடியாகக ச�ொல்லாம ல் கதைககளின் வழியாகக நாமே சிந்திக்க புரிந்து க�ொள்ளும் வகையில் ஆசிரியர் இதனை னை படைத்துள்ளா ர். உலககம் த�ோன்றியது எப்படி என்ற வினாவிற்கு இன்று வரை தெளிவான விளக்கம் கிடைக்கவில்லை ை. ஆனால், உலககம் த�ோன்றியதற்கு இக்கதை வியப்பான பதில்களை தருகிறது. இந்நூலில் நாய் ஏன் பூனையைத் துரத்துகிறது? க�ொசு ஏன் ககடிக்கிறது? வண்ணத்துப்பூச்சிககள் ஏன் பூக்களை சுற்றுகிறது? போன்ற தலைப்புககளில் ககதைககள் உள்ளன . இந்த புத்தகத்தில் இருளில்தா ன் நட்சத்திரங்கள் தெரியும் என்ற ககருத்து எனை னை சிந்திக்க வைததது. பககலில் நட்சத்திரங்கள் இருந்தாலும் அவை நமக்கு தெரிவதில்லை ை. இருள் வந்த பிறகுதான் அவற்றின் ஒளி தெரிகிறது அதுபோல, வாழ்க்கையிலும் ககஷடங்கள் வரும்போ துதான் நம்முடைய தைரியம், திறமை, நம்பிக்கை ஆகியவை வெளிப்படுகின்றன . த�ோல்வியை ககண்டு துவண்டு விடாமல், அதிலிருந்து பாடம் கற்றுக்ககொண்டு மீண்டும் முயற்சி செயய வேண்டும் என்பதை இந்த ககருத்து உணர்த்துகிறது. இந்த நூலைப் படிக்கும்போ து பல புதிய விஷயங்களைத் தெரிந்துக�ொண்டே ன். சில கதைககள் ஆச்சரியமாககவும், சில கதைககள் வேடிக்கை யாககவும் இருந்தன. இயற் கையைப் பற்றி பல்வேறு மக்க ள் எவ் வாறு சிந்தித்தார்கள் எ ன் பதை யு ம் தெரிந்துக�ொள்ள முடிந்தது. ஆசிரியர் இந்தக் கதைகளை மிகக வும் எளிமையான தமிழில் எழுதியுள்ளா ர். அதனால் சிறுவர்க ளான நாங்களும் எளிதாகப் புரிந்துக�ொண்டு படிக்க முடிகிறது. அதே நேரத்தில் பெரியவர்க ளும் ரசிக்கும் வகையில் கதைககள் சுவையாகக உள்ளன . இந்தப் புத்தககத் தைப் படிதததன் மூலம் இயற் கையைப் பற்றியும், உலகின் பல்வேறு மக்களின் வாழ்க்கை மற்றும் ககற்ப னை னை பற்றியும் தெரிந்து க�ொண்டே ன். மேலும், ஒவ்வொரு கதைக்கும் பின்னால் ஒரு சுவாரசியமான சிந்தனை னை இருப்பதை உணர்ந்தே ன். எனக்கு ‘கால் முளைதத கதைககள்’ புத்தககம் மிககவும் பிடித்திருந்தது. வித்தியாசமான கதைகளைப் படிக்க விரும்பும் மாணவர்கள் இந்தப் புத்தககத் தைப் படிக்கலாம். நூலாய்வு... – பா.கவி ஸ்ரீ, 9-A கால் முளைத்த கதைகள் நூலின் பெயர் : கால் முளைதத கதைகள் ஆசிரியர் : எஸ். ராமகிருஷணன் வகை : நாட�ோடிக் கதைகள் பதிப்பககம் : தேசாந்திரி பதிப்பகம் தளிர் அக்டோபர் 2026 4 | |"}, {"page": 5, "pdf_page": 5, "text": "நூலாய்வு... – பூர் ா ஸ்ரீ, 9-A கிறுகிறு வானம் அனை னைவருக்கும் வணக்கம் என்னுடைய பெயர் பூர்ணா . நான் எனது பள்ளி நூலகத் திலிருந்து ‘கிறு கிறு வானம்' என்ற நூலை எடுத்து படித்தேன் அந்த நூலை பற்றிய சில ககருத்துக்களை இப்பொழுது உங்களுடன் பகிர்ந்துக�ொள்கிறேன். நூல் அறிமுகம் ‘கிறுகிறு வானம்’ என்ற நூலைப் பிரபல எழுத்தாளர் எஸ். ராமகிருஷணன் அவர்கள் எழுதியுள்ளா ர். இது குழந் தைககளுக் காகக எழுதப்படட சுவாரசியமான நூல். ஒரு கிராமத்துச் சிறுவனின் குழந்தைப் பருவ நினை னைவுககள், பள்ளி அனுபவங்கள் மற்றும் அவன் பார்த்து ரசிதத உலககம் ஆகியவை இந்நூலில் அழகாககக் கூறப்பட்டுள்ளன . நூலின் சிறப்பு இந்த நூலில் “என் பேரு ஓட் டை பல்லு”, “சாப்பாடும் கூப்பாடும்”, “கிறு கிறு வானம்”, “க�ோழித் தூக்கம்”, “யாரு தச்ச சட் டை” ப ோன்ற சுவாரசியமான தலைப்புகக ளில் பத்து உண்மைச் சம்பவங்க ள் இடம்பெற் றுள்ளன . ஒவ் வொரு சம்பவமும் குழந் தைககளின் வாழ்க்கைய�ோ const TOC=[];

const pages=Array.from(document.querySelectorAll('.page'));
const loading=document.getElementById('loading');
const viewport=document.getElementById('viewport');
const wrapper=document.getElementById('book-wrapper');
const flipAudio=document.getElementById('flipSound');
let pageFlip=null,currentZoom=1,isDragging=false,dragStartX=0,dragStartY=0,panX=0,panY=0,dragStartPanX=0,dragStartPanY=0,currentPage=1,autoFit=true,lastSound=0;
let pinchStartDistance=0,pinchStartZoom=1,pinchStartPanX=0,pinchStartPanY=0;
const activePointers=new Map();

function playFlip(){
  if(!flipAudio)return;
  const now=Date.now();
  if(now-lastSound<200)return;
  lastSound=now;
  try{
    flipAudio.pause();
    flipAudio.currentTime=0;
    const p=flipAudio.play();
    if(p&&p.catch)p.catch(()=>{
      const clone=flipAudio.cloneNode(true);
      clone.play().catch(()=>{});
    });
  }catch(_){}
}

function updateTransform(){
  wrapper.style.transform=`translate(${panX}px,${panY}px) scale(${currentZoom})`;
  document.getElementById('zoom-label').textContent=Math.round(currentZoom*100)+'%';
  viewport.style.cursor=currentZoom>1.01?'grab':'default';
}
function center(){
  panX=0;panY=0;updateTransform();
}
function setZoom(z, focusX=null, focusY=null){
  const next=Math.max(.55,Math.min(3,z));
  if(focusX!==null && focusY!==null){
    const rect=viewport.getBoundingClientRect();
    const x=focusX-rect.left-rect.width/2;
    const y=focusY-rect.top-rect.height/2;
    const ratio=next/currentZoom;
    panX=x-(x-panX)*ratio;
    panY=y-(y-panY)*ratio;
  }
  currentZoom=next;
  if(currentZoom<=1){panX=0;panY=0;}
  updateTransform();
}
function userZoom(z){autoFit=false;setZoom(z);}
function zoomAtPointer(z,e){
  autoFit=false;
  if(e) setZoom(z,e.clientX,e.clientY); else setZoom(z);
}
function showStatus(t){const s=document.getElementById('status');s.textContent=t;s.style.display='block';clearTimeout(window._st);window._st=setTimeout(()=>s.style.display='none',3000)}
function goToPage(n){
  n=Math.max(1,Math.min(TOTAL,parseInt(n)||1));
  if(pageFlip){pageFlip.flip(n-1)}else{currentPage=n;renderFallbackPage();playFlip()}
}
function renderFallbackPage(){pages.forEach((p,i)=>p.style.display=(i===currentPage-1?'block':'none'));document.getElementById('current-page').textContent=currentPage}
function fitScreen(){
  currentZoom=1;panX=0;panY=0;
  updateTransform();
  autoFit=true;
  if(pageFlip){try{pageFlip.update()}catch(_){}}
}
function fitWidth(){fitScreen();}
function pointerDistance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
viewport.addEventListener('pointerdown',e=>{
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size===2){
    const pts=[...activePointers.values()];
    pinchStartDistance=pointerDistance(pts[0],pts[1]);
    pinchStartZoom=currentZoom;pinchStartPanX=panX;pinchStartPanY=panY;
    autoFit=false;
    return;
  }
  if(currentZoom>1.01 && activePointers.size===1){
    isDragging=true;dragStartX=e.clientX;dragStartY=e.clientY;
    dragStartPanX=panX;dragStartPanY=panY;
    viewport.style.cursor='grabbing';
    try{viewport.setPointerCapture(e.pointerId)}catch(_){}
  }
});
viewport.addEventListener('pointermove',e=>{
  if(!activePointers.has(e.pointerId))return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size===2 && pinchStartDistance>0){
    const pts=[...activePointers.values()];
    const midX=(pts[0].x+pts[1].x)/2,midY=(pts[0].y+pts[1].y)/2;
    const ratio=pointerDistance(pts[0],pts[1])/pinchStartDistance;
    setZoom(pinchStartZoom*ratio,midX,midY);
    e.preventDefault();
  }else if(isDragging && currentZoom>1.01){
    panX=dragStartPanX+(e.clientX-dragStartX);
    panY=dragStartPanY+(e.clientY-dragStartY);
    updateTransform();e.preventDefault();
  }
},{passive:false});
function endPointer(e){
  activePointers.delete(e.pointerId);
  if(activePointers.size<2)pinchStartDistance=0;
  if(activePointers.size===0){isDragging=false;updateTransform();}
}
viewport.addEventListener('pointerup',endPointer);
viewport.addEventListener('pointercancel',endPointer);
viewport.addEventListener('lostpointercapture',endPointer);
viewport.addEventListener('wheel',e=>{
  if(e.ctrlKey){e.preventDefault();zoomAtPointer(currentZoom+(e.deltaY<0?.1:-.1),e);}
  else if(currentZoom>1.01){panX-=e.deltaX;panY-=e.deltaY;updateTransform();e.preventDefault();}
},{passive:false});

function initBook(){
  try{
    if(window.St && St.PageFlip){
      pageFlip=new St.PageFlip(document.getElementById('book'),{
        width:PW,height:PH,size:'stretch',
        minWidth:Math.round(PW*.45),maxWidth:PW*2,
        minHeight:Math.round(PH*.45),maxHeight:PH*1.5,
        showCover:true,usePortrait:true,drawShadow:false,maxShadowOpacity:0,
        mobileScrollSupport:true,flippingTime:600,autoSize:true
      });
      pageFlip.loadFromHTML(pages);
      pageFlip.on('flip',e=>{currentPage=e.data+1;document.getElementById('current-page').textContent=currentPage;playFlip();});
      pageFlip.on('changeState',e=>{if(e.data==='flipping')playFlip();});
    }else{renderFallbackPage();showStatus('அடிப்படை வாசிப்பு முறை')}
  }catch(e){console.error(e);renderFallbackPage();showStatus('அடிப்படை வாசிப்பு முறை')}
  buildThumbnails();buildTOC();loading.style.display='none';setTimeout(fitScreen,80);
}
function buildThumbnails(){const box=document.getElementById('thumb-grid');box.innerHTML='';pages.forEach((p,i)=>{const img=p.querySelector('img');const d=document.createElement('div');d.className='thumb';d.innerHTML=`<img src="${img.src}"><span>${i+1}</span>`;d.onclick=()=>goToPage(i+1);box.appendChild(d)})}
function buildTOC(){const box=document.getElementById('toc-list');box.innerHTML='';if(!TOC.length){box.innerHTML='<div class="empty">PDF உள்ளடக்கப் பட்டியல் இல்லை.</div>';return}TOC.forEach(x=>{const d=document.createElement('div');d.className='toc-item level-'+Math.min(3,x.level);d.textContent=x.title;d.onclick=()=>goToPage(x.page);box.appendChild(d)})}
function doSearch(){const q=document.getElementById('search-input').value.trim().toLowerCase();const box=document.getElementById('search-results');box.innerHTML='';if(!q){return}let count=0;SEARCH_INDEX.forEach(item=>{const idx=item.text.toLowerCase().indexOf(q);if(idx>=0 && count<50){const d=document.createElement('div');d.className='result';const start=Math.max(0,idx-55),end=Math.min(item.text.length,idx+110);const snippet=document.createElement('small');snippet.textContent=item.text.slice(start,end)+(end<item.text.length?'…':'');const t=document.createElement('strong');t.textContent='Page '+item.page;d.appendChild(t);d.appendChild(snippet);d.onclick=()=>goToPage(item.page);box.appendChild(d);count++}});if(!count)box.innerHTML='<div class="empty">தேடல் முடிவு இல்லை.</div>'}
function setupTabs(){[['search','tab-search','panel-search'],['pages','tab-pages','panel-pages'],['toc','tab-toc','panel-toc']].forEach(x=>{document.getElementById(x[1]).onclick=()=>{document.querySelectorAll('.side-tabs button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(x[1]).classList.add('active');document.getElementById(x[2]).classList.add('active')}})}
async function toggleFullscreen(){
  if(document.fullscreenElement){
    try{await document.exitFullscreen();}catch(_){}
    document.body.classList.remove('reader-fullscreen');
    fitScreen();
    return;
  }
  try{
    if(document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen();
      document.body.classList.remove('reader-fullscreen');
    }else{
      document.body.classList.add('reader-fullscreen');
    }
  }catch(err){
    /* Embedded Blogger frames may deny browser fullscreen; expand the reader to its frame. */
    document.body.classList.toggle('reader-fullscreen');
    showStatus(document.body.classList.contains('reader-fullscreen')?'வாசிப்பு திரை விரிவாக்கப்பட்டது. முழு Browser திரைக்கு Blogger embed-ல் allowfullscreen தேவை.':'வழக்கமான திரை');
  }
  setTimeout(fitScreen,100);
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('reader-fullscreen');setTimeout(()=>{if(autoFit)fitScreen()},100)});

document.getElementById('first').onclick=()=>goToPage(1);
document.getElementById('prev').onclick=()=>goToPage(currentPage-1);
document.getElementById('next').onclick=()=>goToPage(currentPage+1);
document.getElementById('last').onclick=()=>goToPage(TOTAL);
document.getElementById('goto').onclick=()=>goToPage(document.getElementById('goto-input').value);
document.getElementById('goto-input').onkeydown=e=>{if(e.key==='Enter')goToPage(e.target.value)};
document.getElementById('zoom-in').onclick=()=>userZoom(currentZoom+.25);
document.getElementById('zoom-out').onclick=()=>userZoom(currentZoom-.25);
document.getElementById('fit').onclick=fitScreen;
document.getElementById('fit-width').onclick=fitWidth;
document.getElementById('actual').onclick=()=>{userZoom(1);center()};
document.getElementById('center').onclick=center;
document.getElementById('full-btn').onclick=toggleFullscreen;

document.getElementById('pan-left').onclick=()=>viewport.scrollLeft-=200;
document.getElementById('pan-right').onclick=()=>viewport.scrollLeft+=200;
document.getElementById('pan-up').onclick=()=>viewport.scrollTop-=200;
document.getElementById('pan-down').onclick=()=>viewport.scrollTop+=200;

document.getElementById('help-btn').onclick=()=>alert('விசைப்பலகை குறுக்குவழிகள்:\n\n← / →  முந்தைய / அடுத்த பக்கம்\nHome / End  முதல் / கடைசி பக்கம்\n+ / -  ஸூம்\n0  100%\nF  முழுத்திரை\nEnter  பக்கத்திற்குச் செல்ல\nCtrl+F  தேடல்\n\nபக்கத்தை நகர்த்த: டூல்பாரில் உள்ள திசை பட்டன்களை (⬅ ⬆ ⬇ ➡) பயன்படுத்தலாம் அல்லது மவுஸால் இழுக்கலாம்.');
document.getElementById('search-btn').onclick=doSearch;
document.getElementById('search-input').onkeydown=e=>{if(e.key==='Enter')doSearch()};

document.getElementById('book').addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('book').addEventListener('dragstart',e=>e.preventDefault());
viewport.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  isDragging=true;
  dragStartX=e.clientX;
  dragStartY=e.clientY;
  startScrollLeft=viewport.scrollLeft;
  startScrollTop=viewport.scrollTop;
});
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  viewport.scrollLeft=startScrollLeft-(e.clientX-dragStartX);
  viewport.scrollTop=startScrollTop-(e.clientY-dragStartY);
});
window.addEventListener('mouseup',()=>isDragging=false);

viewport.addEventListener('wheel',e=>{
  if(e.ctrlKey){
    e.preventDefault();
    userZoom(currentZoom-(e.deltaY*.003));
  }
},{passive:false});
window.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
viewport.addEventListener('dblclick',()=>{userZoom(currentZoom<=1?1.5:1);});

window.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();document.getElementById('search-input').focus();return}
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')goToPage(currentPage+1);
  else if(e.key==='ArrowLeft')goToPage(currentPage-1);
  else if(e.key==='Home')goToPage(1);
  else if(e.key==='End')goToPage(TOTAL);
  else if(e.key==='+')userZoom(currentZoom+.25);
  else if(e.key==='-')userZoom(currentZoom-.25);
  else if(e.key==='0'){userZoom(1);center()}
  else if(e.key.toLowerCase()==='f')toggleFullscreen();
  else if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen();
});
window.addEventListener('resize',()=>{if(autoFit)fitScreen();});
window.addEventListener('orientationchange',()=>setTimeout(()=>{if(autoFit)fitScreen()},250));
setupTabs();
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function checkPassword(){if(!PASSWORD_HASH)return true;const input=document.getElementById('book-pwd-input').value;if(await sha256(input)===PASSWORD_HASH){document.getElementById('password-overlay').style.display='none';return true}document.getElementById('pwd-error').style.display='block';return false}
if(PASSWORD_HASH){document.getElementById('submit-pwd-btn').onclick=checkPassword;document.getElementById('book-pwd-input').onkeydown=e=>{if(e.key==='Enter')checkPassword()};document.getElementById('toggle-pwd-btn').onclick=()=>{const x=document.getElementById('book-pwd-input');x.type=x.type==='password'?'text':'password'};}
window.addEventListener('load',()=>{initBook()});
</script>
</body></html>
